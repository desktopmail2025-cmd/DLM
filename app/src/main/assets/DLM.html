<style>
:root{--e:cubic-bezier(.22,1,.36,1);--f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--b0:#e3f3f6;
--bgc:radial-gradient(60% 38% at 8% 0%,#90e0ef 0,transparent 70%),radial-gradient(50% 36% at 100% 18%,#eac4d5 0,transparent 70%),radial-gradient(70% 45% at 40% 100%,#b8e0d2 0,transparent 70%),#e3f3f6;
--ink:#1c2b38;--mute:#4f6676;--brand:#0077b6;--on:#fff;--acc:#00b4d8;--exp:#b0506a;--inc:#2b7a64;--glass:rgba(255,255,255,.58);--gb:rgba(255,255,255,.8);--solid:#fff;--chip:rgba(3,4,94,.07);--line:rgba(3,4,94,.1);--sheet:rgb(246,252,253);--navb:rgba(255,255,255,.78);--hero:linear-gradient(140deg,#0077b6,#03045e);
--cbg:var(--glass);--cbf:none;--cbo:1px solid var(--gb);--cink:var(--ink);--cmute:var(--mute);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b0:#1d2a30;--bgc:radial-gradient(60% 40% at 0% 0%,rgba(82,121,111,.55),transparent 70%),radial-gradient(50% 36% at 100% 25%,rgba(128,155,206,.26),transparent 70%),radial-gradient(70% 45% at 40% 100%,rgba(53,79,82,.7),transparent 70%),#1d2a30;--ink:#e7efe9;--mute:#a3b8b0;--brand:#84a98c;--on:#14211f;--acc:#b8e0d2;--exp:#eab0c6;--inc:#b8e0d2;--glass:rgba(202,210,197,.09);--gb:rgba(202,210,197,.17);--solid:#26383d;--chip:rgba(202,210,197,.1);--line:rgba(202,210,197,.14);--sheet:rgb(32,46,50);--navb:rgba(30,44,48,.85);--hero:linear-gradient(140deg,#52796f,#2f3e46);color-scheme:dark}}
:root[data-theme="dark"]{--b0:#1d2a30;--bgc:radial-gradient(60% 40% at 0% 0%,rgba(82,121,111,.55),transparent 70%),radial-gradient(50% 36% at 100% 25%,rgba(128,155,206,.26),transparent 70%),radial-gradient(70% 45% at 40% 100%,rgba(53,79,82,.7),transparent 70%),#1d2a30;--ink:#e7efe9;--mute:#a3b8b0;--brand:#84a98c;--on:#14211f;--acc:#b8e0d2;--exp:#eab0c6;--inc:#b8e0d2;--glass:rgba(202,210,197,.09);--gb:rgba(202,210,197,.17);--solid:#26383d;--chip:rgba(202,210,197,.1);--line:rgba(202,210,197,.14);--sheet:rgb(32,46,50);--navb:rgba(30,44,48,.85);--hero:linear-gradient(140deg,#52796f,#2f3e46);color-scheme:dark}
html{background:var(--b0);min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}html.nt *{transition:none!important;animation:none!important}
body{margin:0;color:var(--ink);font:500 15px/1.45 var(--f);-webkit-font-smoothing:antialiased}body:before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgc)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;transition:transform .12s,opacity .15s,background .15s}button:active{transform:scale(.96)}
[data-lp]{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.app{max-width:520px;margin:0 auto;padding:14px 16px 190px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;min-height:42px}.tl{display:flex;align-items:center;gap:10px;min-width:0}.tr{display:flex;gap:8px;align-items:center}
.ttl,.dt{margin:0;font:800 28px/1.1 var(--f);letter-spacing:-.02em}.dt{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ib,.stk,.nav{background:var(--glass);border:1px solid var(--gb)}.pbg .ib,.pbg .stk,.pbg .nav{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:none}.ib svg,.gal svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stk{height:40px;padding:0 13px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:13px;white-space:nowrap}
.mo{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:700;font-size:16px}.mo small{display:block;color:var(--mute);font-weight:600;font-size:12.5px;text-align:center}.mo>div{text-align:center}
.card,.tc,.kpi div{background:var(--cbg);backdrop-filter:var(--cbf);-webkit-backdrop-filter:var(--cbf);border:var(--cbo);color:var(--cink)}
.card small,.card .sm,.tc small,.kpi small{color:var(--cmute)}
.card{border-radius:22px;padding:15px;box-shadow:0 8px 26px rgba(3,4,40,.08);margin-bottom:10px}
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:20px;position:relative;overflow:hidden;margin-bottom:14px;box-shadow:0 12px 32px rgba(3,4,60,.28);border:1px solid rgba(255,255,255,.16)}
.hero:before{content:"";position:absolute;right:-50px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%);pointer-events:none}
.hs{display:grid;grid-template-columns:1fr 1px 1fr;gap:16px;position:relative;z-index:1}.hs hr{border:0;background:rgba(255,255,255,.25);margin:0}
.hs small{opacity:.8;font-weight:600;display:block;font-size:12.5px}.hs b,.num{font:800 26px/1.2 var(--f);letter-spacing:-.02em;display:block;word-break:break-word;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:18px;position:relative;z-index:1}.bar i,.pb i{display:block;height:100%;border-radius:9px;background:#fff;transition:width .5s cubic-bezier(.2,.8,.2,1)}

function addTu(t){fsheet(t?"Edit tuition":"New tuition",[{id:"n",l:"Tuition or subject",t:"text",v:t?t.name:"",p:"e.g. Maths with Mr. Rao"},{id:"h",l:"Teacher (optional)",t:"text",v:t?t.teacher:""},{id:"f",l:"Monthly fee (optional)",t:"number",v:t?t.fee:"",p:"0"},{id:"d",l:"First day of month 1",t:"date",v:t?t.start:TD()},{id:"s",l:"Colour and photo",t:"style",v:{c:t?t.color:PAL[7],img:t?t.img:""}}],o=>{if(!o.n||!o.d)return toast("Add a name and start date");const v={name:o.n,teacher:o.h,fee:+o.f||0,start:o.d,color:o.s.c,img:o.s.img};if(t)Object.assign(t,v);else{const n=Object.assign({id:uid(),days:{},notes:{},pd:{}},v);S.tu.push(n);NEW.add(n.id)}})}
function bud(){fsheet("Budget",[{id:"b",l:"Monthly budget (0 for none)",t:"number",v:S.budget||"",p:"0"},{id:"u",l:"Currency symbol",t:"text",v:S.cur}],o=>{S.budget=Math.max(0,+o.b||0);S.cur=(o.u||"$").slice(0,3)})}
/* ---------- appearance ---------- */
function setAp(k,v){if(AS==="a"){S.ap.all[k]=v;Object.values(S.ap.sec).forEach(o=>delete o[k])}else S.ap.sec[tab][k]=v;save();look();render()}
function sw(k,sel,nd){return'<div class="sw">'+(nd?"":'<button class="chipd'+(!sel?" on":"")+'" data-ap="'+k+':">Default</button>')+PAL.map(c=>'<button data-ap="'+k+':'+c+'" class="'+(c===sel?"on":"")+'" style="background:'+c+'" aria-label="'+c+'"></button>').join("")+'<label class="swc" aria-label="Custom colour"><input type="color" data-ci="'+k+'" value="'+(sel&&sel[0]==="#"?sel:"#0077b6")+'"></label></div>'}
function apSheet(){const eff=k=>{const v=S.ap.sec[tab][k];return v!=null?v:S.ap.all[k]},bg=eff("bg")||"",cc=eff("cc")||"",cs=eff("cs")||"glass";
 open('<h3>Appearance</h3><div class="seg"><button data-ap="sc:s" class="'+(AS==="s"?"on":"")+'">'+TTL[tab]+' only</button><button data-ap="sc:a" class="'+(AS==="a"?"on":"")+'">All sections</button></div>'+
 '<div style="margin:-6px 2px 2px;color:var(--mute);font-size:12.5px">'+(AS==="a"?"Applies to every section and replaces their own looks.":"Applies to "+TTL[tab]+" only.")+'</div><span class="lab">Background</span><div class="sw"><button class="chipd'+(!bg?" on":"")+'" data-ap="bg:">Default</button>'+PRE.map((p,i)=>'<button class="pre'+(bg==="p"+(i+1)?" on":"")+'" data-ap="bg:p'+(i+1)+'" style="background:'+p[0]+'" aria-label="'+PN[i]+'"></button>').join("")+'<button class="gal" data-gal="bg" aria-label="Choose a photo from the gallery">'+GAL+'</button></div>'+consent()+sw("bg",bg[0]==="#"?bg:"",1)+
 '<span class="lab">Card colour</span>'+sw("cc",cc)+'<span class="lab">Card style</span><div class="seg">'+["glass","solid","line"].map(x=>'<button data-ap="cs:'+x+'" class="'+(cs===x?"on":"")+'">'+{glass:"Glass",solid:"Solid",line:"Outline"}[x]+'</button>').join("")+'</div>'+
 (tab==="money"?'<span class="lab">Expense colour</span>'+sw("ec",S.ap.ec||"")+'<span class="lab">Income colour</span>'+sw("ic",S.ap.ic||""):"")+'<button class="del" data-ap="rs:1" style="color:var(--ink)">Reset '+(AS==="a"?"everything":"this section")+'</button>')}
/* ---------- menus ---------- */
function R(k,id){if(k==="tx")return{it:S.tx.find(x=>x.id==id),a:S.tx,p:1};if(k==="sub")return{it:S.subs.find(x=>x.id==id),a:S.subs,p:1};if(k==="tu")return{it:S.tu.find(x=>x.id==id),a:S.tu,p:1};
 if(k==="node"){const r=findNode(id);return r&&{it:r.n,a:r.a}}if(k==="sn"){const[s,n]=id.split("|"),sb=S.subs.find(x=>x.id===s);return sb&&{it:sb.notes.find(x=>x.id===n),a:sb.notes}}}
function menu(k,id){const r=R(k,id);if(!r||!r.it)return;MN={k,id};const it=r.it;open('<h3>'+esc((it.note||it.name||it.n||it.t||it.cat||"").slice(0,40))+'</h3>'+(r.p?'<button class="mn" data-ma="pin">'+(it.pin?"Unpin":"Pin to top")+'</button>':"")+'<button class="mn" data-ma="edit">'+(k==="node"||k==="sn"?"Edit":"Edit")+'</button><button class="mn d" data-ma="del">Delete</button>',1)}
function doMenu(a){const{k,id}=MN,r=R(k,id);close();
 const after=()=>{if(a==="del"&&r.p&&DET&&DET.id==id){DET=null;ST=[]}save();render()};
 if(a==="pin"){r.it.pin=!r.it.pin;after()}
 else if(a==="del"){const el=document.querySelector('[data-lp="'+k+":"+id+'"]'),go2=()=>{r.a.splice(r.a.indexOf(r.it),1);toast("Deleted");after()};if(el){el.classList.add("out");setTimeout(go2,170)}else go2()}
 else{$("#sheet").innerHTML="";if(k==="tx"){ed=id;type=r.it.type;cat=r.it.cat;moneyForm()}else if(k==="sub")addSub(r.it);else if(k==="tu")addTu(r.it);else if(k==="node")addNode(id,r.it);else{const[s,n]=id.split("|");noteForm(s,n)}}}
/* ---------- events ---------- */
$("#fab").onclick=()=>{if(DET&&DET.k==="sub")return addNode("s:"+DET.id);ed=null;$("#sheet").innerHTML="";if(tab==="money"){type="e";cat="Food";moneyForm();setTimeout(()=>$("#amt")&&$("#amt").focus(),300)}else if(tab==="study")addSub();else addTu()};
$("#scrim").onclick=close;
$("#sheet").addEventListener("input",e=>{const i=e.target.dataset.ci;if(!i)return;const v=e.target.value;if(i==="f"){const s=$("#f_s");s.dataset.val=v;s.querySelectorAll("button[data-col]").forEach(x=>x.classList.remove("on"))}else if(i==="ec"||i==="ic"){S.ap[i]=v;save();look();render()}else setAp(i==="bg"?"bg":"cc",v)});
$("#sheet").onclick=e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.xp){S.fs=!S.fs;save();$("#sheet").classList.toggle("full",!!S.fs)}else if(d.ma)doMenu(d.ma);
 else if(d.ap!=null){const i=d.ap.indexOf(":"),k=d.ap.slice(0,i),v=d.ap.slice(i+1);
  if(k==="sc")AS=v;else if(k==="rs"){if(AS==="a"){S.ap.all={};S.ap.sec={money:{},study:{},tu:{}};S.ap.ec="";S.ap.ic=""}else S.ap.sec[tab]={};save();look();render()}else if(k==="ec"||k==="ic"){S.ap[k]=v;save();look();render()}else setAp(k,v);apSheet()}
 else if(d.gal){PT=d.gal==="f"?id=>{const s=$("#f_s");s.dataset.img=id;$("#pv").innerHTML=pv(id)}:id=>{setAp("bg","i:"+id);apSheet()};if(S.photoOk)$("#pf").click();else $("#pc").hidden=false}
 else if(d.pa){S.photoOk=true;save();$("#pc").hidden=true;$("#pf").click()}else if(d.pn)$("#pc").hidden=true
 else if(d.rmimg){$("#f_s").dataset.img="";$("#pv").innerHTML=""}
 else if(d.t){type=d.t;cat=cats(type)[0][0];moneyForm(true)}else if(d.c){cat=d.c;const c=$("#cc");if(c)c.value="";moneyForm(true)}
 else if(d.col){b.parentNode.dataset.val=d.col;[...b.parentNode.children].forEach(x=>x.classList.toggle("on",x===b))}
 else if(b.id==="saveTx"){const a=parseFloat($("#amt").value);if(!(a>0)){$("#amt").focus();return toast("Enter an amount above 0")}
  let ct=cat;const cc=$("#cc").value.trim();if(cc){const f=cats(type).find(x=>x[0].toLowerCase()===cc.toLowerCase());if(f)ct=f[0];else{ct=cc;S.cc[type].push([cc,PAL[(S.cc[type].length*3+1)%PAL.length]])}}
  const o={type,cat:ct,amt:Math.round(a*100)/100,note:$("#note").value.trim(),date:$("#date").value||TD()};if(ed)Object.assign(S.tx.find(x=>x.id==ed),o);else{const n=Object.assign({id:uid()},o);S.tx.push(n);NEW.add(n.id)}
  const m=dt(o.date);ym=new Date(m.getFullYear(),m.getMonth(),1);type="e";cat="Food";ed=null;act();save();close();toast("Saved");render()}
 else if(d.more){if(H.onSave(gather())===undefined){act();save();render();toast("Added");addNode(NT)}}
 else if(b.id==="gSave"){if(H.onSave(gather())===undefined){act();save();close();toast("Saved");render()}}};
function shiftMonth(n){const t=S.tu.find(x=>x.id===DET.id),k=(TK[t.id]==null?curK(t):TK[t.id])+n;TK[t.id]=k;render(true,n>0?"fwd":"bak")}
$(".app").onclick=e=>{if(lpf){lpf=false;return}const b=e.target.closest("button"),d=b?b.dataset:{};
 if(d.th)theme();else if(d.apb){AS="s";apSheet()}else if(d.back)back();
 else if(d.mg){const i=d.mg.indexOf(":");menu(d.mg.slice(0,i),d.mg.slice(i+1))}
 else if(d.mx){MN={k:"tx",id:DET.id};doMenu(d.mx)}
 else if(d.id)go({k:"tx",id:d.id});
 else if(d.tdy){mv="sum";per="d";render(true)}else if(d.mv){mv=d.mv;render(true)}else if(d.m){ym=new Date(ym.getFullYear(),ym.getMonth()+ +d.m,1);render()}else if(d.p){per=d.p;render()}else if(d.bud)bud();
 else if(d.sd){hap();const s=S.subs.find(x=>x.id===d.sd);if(s.days[TD()])delete s.days[TD()];else{s.days[TD()]=1;act();NEWT.add(s.id)}save();render()}
 else if(d.na)addNode(d.na);else if(d.sna)noteForm(d.sna);else if(d.sne){const[a,c]=d.sne.split("|");noteForm(a,c)}
 else if(d.tc){UL=false;go({k:"day",id:d.tc,d:d.d})}
 else if(d.dd){const x=dt(DET.d);x.setDate(x.getDate()+ +d.dd);const t=S.tu.find(y=>y.id===DET.id),el=$("#dn");if(el){const n=el.value.trim();if(n)t.notes[DET.d]=n;else delete t.notes[DET.d]}DET={k:"day",id:DET.id,d:iso(x)};UL=false;save();render(true,+d.dd>0?"fwd":"bak")}
 else if(d.dv)setDay(+d.dv);else if(d.dclr)setDay(0);else if(d.dun){const el=$("#dn");if(el){const t=S.tu.find(y=>y.id===DET.id),n=el.value.trim();if(n)t.notes[DET.d]=n;else delete t.notes[DET.d]}UL=true;render()}
 else if(d.dsave)saveNote(true);
 else if(d.tk)shiftMonth(+d.tk);else if(d.tkt){delete TK[DET.id];render(true,"f0")}
 else if(d.tp){const[id,k]=d.tp.split(":"),t=S.tu.find(x=>x.id===id);if(t.pd[k])delete t.pd[k];else t.pd[k]=true;save();render()}
 else{const r=e.target.closest("[data-nt]");if(r){togNode(r.dataset.nt);return}const o=e.target.closest("[data-open]");if(o){const i=o.dataset.open.indexOf(":");go({k:o.dataset.open.slice(0,i),id:o.dataset.open.slice(i+1)})}}};
let lt,sx=0,sy=0,tx0=0,ty0=0;const ap=$(".app");
ap.addEventListener("pointerdown",e=>{lpf=false;const t=e.target.closest("[data-lp]");if(!t)return;sx=e.clientX;sy=e.clientY;clearTimeout(lt);lt=setTimeout(()=>{lpf=true;lpRun(t)},550)});
["pointerup","pointercancel","pointerleave"].forEach(n=>ap.addEventListener(n,()=>clearTimeout(lt)));
ap.addEventListener("pointermove",e=>{if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10)clearTimeout(lt)});
function lpRun(t){navigator.vibrate&&navigator.vibrate(18);const v=t.dataset.lp,i=v.indexOf(":"),k=v.slice(0,i),id=v.slice(i+1);if(k==="day"){const[a,c]=id.split("|");FOCUS=true;UL=false;go({k:"day",id:a,d:c})}else menu(k,id)}
ap.addEventListener("contextmenu",e=>{e.preventDefault();const t=e.target.closest("[data-lp]");if(!t||lpf)return;clearTimeout(lt);lpf=true;lpRun(t)});
document.addEventListener("keydown",e=>{const t=e.target;if(e.key==="Escape"){if($("#sheet").classList.contains("on"))close();else if(DET)back();return}if((e.key==="Enter"||e.key===" ")&&t.matches&&t.matches("[data-open],[data-nt]")){e.preventDefault();t.click()}});
ap.addEventListener("touchstart",e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY},{passive:true});
ap.addEventListener("touchend",e=>{if(!DET||DET.k!=="tu"||!e.target.closest(".calw"))return;const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;if(Math.abs(dx)>60&&Math.abs(dy)<40){clearTimeout(lt);lpf=false;shiftMonth(dx<0?1:-1)}},{passive:true});
(()=>{const sh=$("#sheet");let y0=0,dy=0,on=false;sh.addEventListener("touchstart",e=>{if(sh.scrollTop>0)return;y0=e.touches[0].clientY;dy=0;on=true;sh.style.transition="none"},{passive:true});
